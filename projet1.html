<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> PROJET 1</title>  
    <style> 
        div{ 
            margin-bottom: 50px;

        }
        body{
            background-color: blueviolet;
        }
        form{ 
            text-align: center;

        }
        h1{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 id="main-title"> MON FORMULAIRE </h1>
    <form id="mon-formulaire"> 
  <div>
<label for="nom"> NOM </label>
<input type="text" id="nom" name="nom" placeholder="Ajouter votre nom"> </div>
<div>
<label for="prenom"> PRENOMS </label>
<input type="text" id="nom" name="prenom" placeholder="Entrez votre prenom ">
</div>

<div>
<label for="telephone">TELEPHONE  </label>
<input type="tel" id="telephone" name="telephone" placeholder="Entrez votre numero de telephone ">
</div>

<div>
<label for="siteweb"> SITE WEB </label>
<input type="url" id="siteweb" name="siteweb" placeholder="Entrez votre site web">
</div>
<div>
<label for="priorite"> PRIORITE  </label> 
<select id="priorite" name="priorite"> 
    <option value="faible"> Faible </option>
  <option value="moyenne"> Moyenne </option>
  <option value="haute"> Haute</option>
</select> 

</div>


<div>
<label for="type"> TYPE </label> 
<select id="type" name="type"> 
    <option value="maj">Mise a jour du site   </option>
  <option value="bug"> Signaler </option>
  <option value="autre"> Autre</option>
</select> 

</div>
<div> 
<label for="message">Message </label> 
<textarea id="message" name="message" placeholder="Tapez votre message"></textarea> 
</div>
<div> 
    <button type="submit"> SOUMETTRE </button>
</div>
 </form>
<script>  
const monFormulaire = document.getElementById("mon-formulaire");
monFormulaire.addEventListener("submit", function(event) { event.preventDefault();
    console.log("Le formulaire a ete soumis !")

})  


</script>

</body>
</html>
